# Repeater Box: hardware-free bench configuration.
# Checked against upstream SvxLink 24.02 configuration and source, not Pi hardware.
# NONE creates dummy RX/TX objects: no sound card or serial PTT is opened.
# The packaged vendor service remains masked. Only repeater-engine.service
# should load this file, with --config=/etc/repeater-box/svxlink-bench.conf.

[GLOBAL]
LOGICS=RepeaterLogic
TIMESTAMP_FORMAT="%Y-%m-%d %H:%M:%S"
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1

[RepeaterLogic]
TYPE=Repeater
RX=NONE
TX=NONE
MODULES=
CALLSIGN=N0CALL
ONLINE=0
NO_REPEAT=1
EVENT_HANDLER=/usr/share/svxlink/events.tcl
DEFAULT_LANG=en_US
SHORT_IDENT_INTERVAL=0
LONG_IDENT_INTERVAL=0
RGR_SOUND_DELAY=-1
IDLE_SOUND_INTERVAL=0
IDLE_TIMEOUT=1
OPEN_ON_SQL=100
OPEN_SQL_FLANK=OPEN
STATE_PTY=/run/repeater-box/svxlink-state
COMMAND_PTY=/run/repeater-box/svxlink-command

# No radio audio, PTT, recorder, reflector, EchoLink, DTMF administration,
# identification, or scheduled messages are enabled by this configuration.
# N0CALL is a bench placeholder. Never use it for an on-air installation.
